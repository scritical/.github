name: Bump version
on:
  workflow_call:

jobs:
  extract_version_bump:
    uses: scritical/.github/.github/workflows/extract_version_bump.yaml@main

  bump_version:
    needs: extract_version_bump
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # No permissions block: the job inherits the caller's grant. It needs contents: write, and pull-requests: read
    # lets it tag stacks in order. Requesting more than the caller grants fails the workflow at startup.
    # One run at a time per repository, in the order they were queued, so no two runs plan tags at once.
    concurrency:
      group: bump-version
      cancel-in-progress: false
      queue: max
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: '0'

    # Each merged PR gets its own vX.Y.Z tag, bumped by the [major], [minor] or [patch] keyword in its title.
    # In a stack, every run tags all untagged merged PRs at or below its own, in stack order, in one atomic push.
    # Limitation: versions follow the order the runs are queued in, so a PR merged outside the stack around the
    # same time can get a version out of commit order.
    - name: Tag the merged PRs
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        OWN_BUMP: ${{ needs.extract_version_bump.outputs.version_bump }}
      run: |
        set -euo pipefail
        version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'

        # Print the bump keyword of the title $1, or "none" unless it has exactly one.
        title_bump() {
          local title="${1,,}" bump found=()
          for bump in major minor patch; do
            if [[ "$title" == *"[$bump]"* ]]; then
              found+=("$bump")
            fi
          done
          if (( ${#found[@]} == 1 )); then
            echo "${found[0]}"
          else
            echo none
          fi
        }

        # Print the version after $1 for the bump $2. 10# reads components with leading zeros as decimal.
        next_version() {
          local major minor patch
          IFS=. read -r major minor patch <<< "${1#v}"
          case "$2" in
            major) echo "v$((10#$major + 1)).0.0" ;;
            minor) echo "v$((10#$major)).$((10#$minor + 1)).0" ;;
            patch) echo "v$((10#$major)).$((10#$minor)).$((10#$patch + 1))" ;;
          esac
        }

        # Print the highest version tag in the repository, or v0.0.0 when there is none.
        latest_version() {
          local latest
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E "$version_pattern" | head -n 1 || true)
          echo "${latest:-v0.0.0}"
        }

        # Succeed when a version tag points at the commit $1.
        is_tagged() {
          # grep without -q reads all its input, so pipefail never sees a SIGPIPE from git.
          git tag --list 'v*' --points-at "$1" | grep -E "$version_pattern" > /dev/null
        }

        # Print "position<TAB>merged<TAB>sha<TAB>number<TAB>title" for each PR of the stack $1, sorted by position.
        # No field may be empty: read collapses adjacent tabs.
        stack_prs() {
          local stack_json number
          stack_json=$(gh api "repos/$REPO/stacks/$1") || return 1
          jq -r '.pull_requests[].number' <<< "$stack_json" | while read -r number; do
            gh api "repos/$REPO/pulls/$number" --jq \
              '[.stack.position // 0, .merged_at != null, .merge_commit_sha // "none", .number, .title] | @tsv' ||
              exit 1
          done | sort -n
        }

        # Print "sha<TAB>number<TAB>bump" for each merged PR at or below position $2 in the stack $1 whose commit
        # is in this run's history. The bump is "none" unless the title has exactly one keyword.
        stack_releases() {
          local prs position merged sha number title
          if ! prs=$(stack_prs "$1"); then
            echo "::error::Could not read stack #$1. Re-run this job to tag its PRs." >&2
            exit 1
          fi
          while IFS=$'\t' read -r position merged sha number title; do
            if (( position == 0 || position > $2 )) || [[ "$merged" != true ]]; then
              continue
            fi
            if git merge-base --is-ancestor "$sha" "$MERGE_SHA" 2> /dev/null; then
              printf '%s\t%s\t%s\n' "$sha" "$number" "$(title_bump "$title")"
            fi
          done <<< "$prs"
        }

        # Print this PR's stack object, or "null" when it is in no stack. Print nothing, with a warning, when the
        # token may not read PRs, and fail on any other error so that a re-run can tag the stack in order.
        pr_stack() {
          local errors stack
          errors=$(mktemp)
          # On an HTTP error gh prints the error body to stdout, so print the output only when the call succeeds.
          if stack=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.stack' 2> "$errors"); then
            echo "$stack"
            return 0
          fi
          cat "$errors" >&2
          if grep -E 'HTTP 404|Resource not accessible by integration' "$errors" > /dev/null; then
            echo "::warning::Could not read PR #$PR_NUMBER. Grant the calling job 'pull-requests: read' to tag" \
              "stacks in order. Tagging this PR on its own." >&2
            return 0
          fi
          echo "::error::Could not read PR #$PR_NUMBER. Re-run this job." >&2
          return 1
        }

        # Print this run's releases: the merged PRs of its stack up to this one, or this PR alone.
        releases() {
          local stack
          stack=$(pr_stack) || exit 1
          if [[ -z "$stack" || "$stack" == "null" ]]; then
            printf '%s\t%s\t%s\n' "$MERGE_SHA" "$PR_NUMBER" "$OWN_BUMP"
            return
          fi
          stack_releases "$(jq -r '.number' <<< "$stack")" "$(jq -r '.position' <<< "$stack")"
        }

        # Plan a tag for each untagged release in the file $1, counting up from the latest version.
        # Sets refspecs to "sha:refs/tags/vX.Y.Z" for each planned tag.
        plan_tags() {
          local version sha number bump
          refspecs=()
          version=$(latest_version)
          while IFS=$'\t' read -r sha number bump; do
            if is_tagged "$sha"; then
              continue
            fi
            if [[ "$bump" == none ]]; then
              echo "::warning::#$number has no single [major], [minor] or [patch] in its title; the next tag covers it."
              continue
            fi
            version=$(next_version "$version" "$bump")
            echo "Tagging #$number ($sha) as $version"
            refspecs+=("$sha:refs/tags/$version")
          done < "$1"
        }

        release_list=$(mktemp)
        releases > "$release_list"
        plan_tags "$release_list"
        if (( ${#refspecs[@]} == 0 )); then
          echo "Nothing to tag."
          exit 0
        fi
        if ! git push --atomic origin "${refspecs[@]}"; then
          echo "::error::Could not push the version tags; see the git error above."
          exit 1
        fi
