on:
  workflow_call:
    inputs:
      TIMEOUT:
        type: number
        default: 120
        description: "Timeout for the job in minutes"
      GCC_CONFIG:
        type: string
        default: ""
        description: "Path to GCC configuration file"
      INTEL_CONFIG:
        type: string
        default: ""
        description: "Path to Intel configuration file"
      BUILD_SCRIPT:
        type: string
        default: ".github/build.sh"
        description: "Path to build script"
      TEST_SCRIPT:
        type: string
        default: ".github/test.sh"
        description: "Path to test script"
      USE_DVC:
        type: boolean
        default: false
        description: "Enables DVC to pull reference data for tests."
      GCC_DOCKER_TAG:
        type: string
        default: u24-gcc-ompi-latest
        description: "GHCR tag for the GCC/OpenMPI private-dev image"
      INTEL_DOCKER_TAG:
        type: string
        default: u24-intel-impi-latest
        description: "GHCR tag for the Intel/IMPI private-dev image"
    secrets:
      BW_ACCESS_TOKEN:
        required: true
        description: "Bitwarden machine account access token"

jobs:
  build-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.TIMEOUT }}
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_TAG: ${{ inputs.GCC_DOCKER_TAG }}
      CONFIG_FILE: ${{ inputs.GCC_CONFIG }}

    steps: &build_steps
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull DVC files
        if: inputs.USE_DVC
        uses: scritical/.github/.github/actions/dvc_pull@main
        with:
          BW_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}

      - name: Docker setup
        uses: scritical/.github/.github/actions/docker-setup@main
        with:
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

      - name: Build
        if: inputs.BUILD_SCRIPT != ''
        run: |
          docker exec \
            -e CONFIG_FILE="${{ env.CONFIG_FILE }}" \
            app /bin/bash -c ". $BASHRC && cd $DOCKER_WORKING_DIR && /bin/bash ${{ inputs.BUILD_SCRIPT }}"

      - name: Test
        if: inputs.TEST_SCRIPT != ''
        run: |
          docker exec \
            -e AGENT_NAME="${{ runner.name }}" \
            -e BUILD_REASON="${{ github.event_name }}" \
            app /bin/bash -c ". $BASHRC && cd $DOCKER_WORKING_DIR && source ~/MPIOversubscribe.sh && /bin/bash ${{ inputs.TEST_SCRIPT }}"

      - name: Docker cleanup
        uses: scritical/.github/.github/actions/docker-cleanup@main


  build-intel:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.TIMEOUT }}
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_TAG: ${{ inputs.INTEL_DOCKER_TAG }}
      CONFIG_FILE: ${{ inputs.INTEL_CONFIG }}
    steps: *build_steps
          
