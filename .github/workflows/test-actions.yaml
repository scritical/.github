# Tests the scripts of this repository's composite actions. Not a reusable workflow.
name: Test actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests
