# Tests the scripts of this repository's composite actions. Not a reusable workflow.
name: Test actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install pytest==9.0.3
          python -m pytest tests

  depends-on:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Read Depends-On lines
        id: depends-on
        uses: ./.github/actions/depends-on
        with:
          token: ${{ github.token }}

      - name: Show the output
        env:
          PULL_REQUESTS: ${{ steps.depends-on.outputs.pull-requests }}
        run: printf 'pull-requests=%q\n' "$PULL_REQUESTS"
