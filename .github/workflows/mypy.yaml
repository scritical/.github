on:
  workflow_call:
    inputs:
      TIMEOUT:
        type: number
        default: 30
        description: "Timeout for the job in minutes"
      PIP_INSTALL_FLAGS:
        type: string
        default: ""
        description: "Additional flags passed to 'pip install' (e.g. '--no-build-isolation')"
      DOCKER_TAG:
        type: string
        default: u24-gcc-ompi-latest
        description: "GHCR tag for the private-dev image"

jobs:
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.TIMEOUT }}
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_TAG: ${{ inputs.DOCKER_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker setup
        uses: scritical/.github/.github/actions/docker-setup@main
        with:
          DOCKER_TAG: ${{ env.DOCKER_TAG }}

      - name: MyPy type checking
        run: |
          docker exec \
            -e AGENT_NAME="${{ runner.name }}" \
            -e BUILD_REASON="${{ github.event_name }}" \
            app /bin/bash -c ". $BASHRC && cd $DOCKER_WORKING_DIR && pip install ${{ inputs.PIP_INSTALL_FLAGS }} . && mypy"

      - name: Docker cleanup
        uses: scritical/.github/.github/actions/docker-cleanup@main

