name: DVC pull

description: Creates an Python environment, installs DVC and pulls files from the S3 bucket configured in the repos .dvc/config file.

inputs:
  BW_ACCESS_TOKEN:
    description: Bitwarden machine account access token
    required: true


runs:
  using: composite
  steps:
    - name: Get AWS credentials from Bitwarden
      uses: bitwarden/sm-action@v2
      with:
        access_token: ${{ inputs.BW_ACCESS_TOKEN }}
        secrets: |
          0ef1b3e4-10c4-4bdd-8aed-b41d016e9518 > AWS_ROLE_ARN

    - name: Configure AWS Credentials for DVC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: us-east-2

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Create venv and install dependencies
      shell: bash
      run: |
        python -m venv .venv
        echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

    - name: Install DVC with S3 support
      shell: bash
      run: |
        pip install --upgrade pip
        # pygtrie>=2.6.0 (released after this dvc pin) removed the internal
        # Trie._NONE_STEP attribute dvc[s3]==3.66.1 still depends on, so an
        # unpinned install breaks `dvc pull` with:
        #   ERROR: unexpected error - type object 'Trie' has no attribute '_NONE_STEP'
        # Reproduced with a fresh `pip install dvc[s3]==3.66.1` (resolves
        # pygtrie 2.6.0) and confirmed dvc 3.67.1 hits the same error, so
        # this isn't a version bump away -- pin pygtrie until dvc's own
        # constraints catch up. Pinned in the same install as dvc[s3] so
        # the resolver picks a mutually-compatible set from the start.
        pip install 'dvc[s3]==3.66.1' 'pygtrie<2.6.0'

    - name: Remove 'profile' section from dvc config file
      shell: bash
      run: |
        sed -i '/profile/d' .dvc/config

    - name: Pull files
      shell: bash
      run: |
        dvc pull

