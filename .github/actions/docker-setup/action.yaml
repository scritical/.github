name: Docker setup

description: Shared steps to prepare repo environment and start container.

inputs:
  SCRITICAL_HOMEDIR:
    description: Base home directory for container paths
    required: false
    default: /home/scriticaluser
  BASHRC:
    description: Path to bashrc for container environment
    required: false
    default: /home/scriticaluser/.bashrc_scritical
  DOCKER_TAG:
    description: Docker image tag to use
    required: true
  BW_ACCESS_TOKEN:
    description: Bitwarden machine account access token
    required: true
  DOCKER_RUN_ARGS:
    description: Extra arguments for docker run, such as "--runtime=nvidia --gpus all" on a GPU runner
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set repo environment variables
      shell: bash
      run: |
        scritical_homedir="${{ inputs.SCRITICAL_HOMEDIR }}"
        echo "SCRITICAL_HOMEDIR=$scritical_homedir" >> "$GITHUB_ENV"
        echo "BASHRC=${{ inputs.BASHRC }}" >> "$GITHUB_ENV"
        repo_name="${{ github.event.repository.name }}"
        echo "REPO_NAME=$repo_name" >> "$GITHUB_ENV"
        echo "DOCKER_WORKING_DIR=$scritical_homedir/repos/$repo_name" >> "$GITHUB_ENV"
        echo "DOCKER_MOUNT_DIR=$scritical_homedir/mount/$repo_name" >> "$GITHUB_ENV"

    - name: Get Docker credentials from Bitwarden
      uses: bitwarden/sm-action@v3.0.1
      with:
        access_token: ${{ inputs.BW_ACCESS_TOKEN }}
        secrets: |
          71828b4d-6441-4e7d-b7f5-b3f8002289a5 > DOCKER_USERNAME
          e172281c-7428-412c-a86c-b3f7010f81bd > DOCKER_OAT

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_OAT }}

    - name: Select the image
      shell: bash
      env:
        DOCKER_TAG: ${{ inputs.DOCKER_TAG }}
        PR_BODY: ${{ github.event.pull_request.body }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        image="scritical/private-dev:$DOCKER_TAG"
        # "Depends-On: scritical/docker#N" in the PR description selects docker PR N's images, which
        # have per-platform tags only. Text after the reference is ignored. Read from the event
        # payload, so a re-run sees the old description.
        pr=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
          | grep -ioP '^[ \t]*(?:[-*][ \t]+)?depends-on:[ \t]*(?:scritical/docker#|https://github\.com/scritical/docker/pull/)\K[0-9]+(?=/?(?:\s|$))' \
          | sort -u || true)
        if [[ $(wc -w <<< "$pr") -gt 1 ]]; then
          echo "::error::More than one Depends-On line names a scritical/docker PR"
          exit 1
        fi
        if [[ -n "$pr" ]]; then
          case "$RUNNER_ARCH" in
            X64) platform=amd64 ;;
            ARM64) platform=arm64v8 ;;
            *) echo "::error::No docker images are built for $RUNNER_ARCH"; exit 1 ;;
          esac
          image="scritical/private-dev:$DOCKER_TAG-pr$pr-$platform"
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "::error::$image does not exist yet. Re-run once scritical/docker#$pr has pushed its images."
            exit 1
          fi
          echo "::warning::Running on scritical/docker#$pr's image $image, not the published one"
        fi
        echo "SCRITICAL_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"

    - name: Start Docker container
      shell: bash
      run: |
        docker run -t -d --name app --shm-size=2g ${{ inputs.DOCKER_RUN_ARGS }} \
          --mount "type=bind,src=${{ github.workspace }},target=${{ env.DOCKER_MOUNT_DIR }}" \
          "$SCRITICAL_DOCKER_IMAGE" /bin/bash

        # Copy repo to working directory
        docker exec app /bin/bash -c "rm -rf $DOCKER_WORKING_DIR && mkdir -p $DOCKER_WORKING_DIR && cp -a $DOCKER_MOUNT_DIR/. $DOCKER_WORKING_DIR/"

